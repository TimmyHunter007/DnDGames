<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sessions - D&D DM Toolkit</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Navigation -->
        <nav class="navbar">
            <div class="nav-brand">
                <h1>D&D DM Toolkit</h1>
            </div>
            <div class="nav-dropdown-container">
                <button class="nav-dropdown-toggle" id="navDropdownToggle">
                    <span>Menu</span>
                    <span class="dropdown-icon">▼</span>
                </button>
                <div class="nav-dropdown-menu" id="navDropdownMenu">
                    <a href="/dashboard" class="nav-link">Dashboard</a>
                    <a href="/sessions" class="nav-link active">Sessions</a>
                    <a href="/encounters" class="nav-link">Encounters</a>
                    <a href="/dice" class="nav-link">Dice Roller</a>
                    <a href="/initiative" class="nav-link">Initiative</a>
                    <a href="/spells" class="nav-link">Spells</a>
                    <a href="/enemies" class="nav-link">Enemies</a>
                    <a href="/npcs" class="nav-link">NPCs</a>
                    <a href="/items" class="nav-link">Items</a>
                    <a href="/notes" class="nav-link">Notes</a>
                    <a href="/characters" class="nav-link">Characters</a>
                    <a href="/campaigns" class="nav-link">Campaigns</a>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <div class="page-header">
                <h2>Campaign Sessions</h2>
                <div class="page-actions">
                    <button class="btn-primary" onclick="showSessionModal()">
                        <span class="btn-icon">📖</span>
                        New Session
                    </button>
                </div>
            </div>

            <!-- Sessions List -->
            <div class="content-section">
                <div id="sessions-list" class="sessions-grid">
                    <!-- Sessions will be loaded here -->
                </div>
            </div>
        </main>
    </div>

    <!-- Session Modal -->
    <div id="session-modal" class="modal-overlay" style="display: none;">
        <div class="modal">
            <div class="modal-header">
                <h3 id="session-modal-title">New Session</h3>
                <span class="modal-close">&times;</span>
            </div>
            <div class="modal-content">
                <div id="session-modal-body">
                    <!-- Session form will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/js/shared.js"></script>
    <script src="/js/sessions.js"></script>
    <script>
        // Modal close functionality
        document.addEventListener('DOMContentLoaded', function() {
            const modal = document.getElementById('session-modal');
            const closeBtn = modal.querySelector('.modal-close');
            
            closeBtn.onclick = function() {
                modal.style.display = 'none';
            }
            
            window.onclick = function(event) {
                if (event.target == modal) {
                    modal.style.display = 'none';
                }
            }
        });
    </script>

    <!-- Return to Top Button -->
    <button class="return-to-top" id="returnToTop" aria-label="Return to top">↑</button>
</body>
</html>
