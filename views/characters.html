
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Characters - D&D DM Toolkit</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <script src="/js/theme.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Navigation -->
        <nav class="navbar">
            <div class="nav-brand">
                <h1>D&D DM Toolkit</h1>
                <button class="theme-toggle" id="themeToggle" title="Toggle Light/Dark Mode">
                    <span class="theme-icon">🌙</span>
                </button>
            </div>
            <div class="nav-dropdown-container">
                <button class="nav-dropdown-toggle" id="navDropdownToggle">
                    <span>Menu</span>
                    <span class="dropdown-icon">▼</span>
                </button>
                <div class="nav-dropdown-menu" id="navDropdownMenu">
                    <a href="/dashboard" class="nav-link">Dashboard</a>
                    <a href="/sessions" class="nav-link">Sessions</a>
                    <a href="/encounters" class="nav-link">Encounters</a>
                    <a href="/dice" class="nav-link">Dice Roller</a>
                    <a href="/initiative" class="nav-link">Initiative</a>
                    <a href="/spells" class="nav-link">Spells</a>
                    <a href="/enemies" class="nav-link">Enemies</a>
                    <a href="/npcs" class="nav-link">NPCs</a>
                    <a href="/items" class="nav-link">Items</a>
                    <a href="/notes" class="nav-link">Notes</a>
                    <a href="/characters" class="nav-link active">Characters</a>
                    <a href="#" class="nav-link" onclick="openBoardWindow(); return false;">Battle Board</a>
                    <a href="/campaigns" class="nav-link">Campaigns</a>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <div class="page-header">
                <h2>Player Characters</h2>
                <div class="page-actions">
                    <button class="action-btn" onclick="showCreateCharacterModal()">
                        <span>👤</span> Add Character
                    </button>
                </div>
            </div>

            <div class="characters-grid" id="characters-list">
                <!-- Characters will be loaded here -->
            </div>
        </main>
    </div>

    <!-- Return to Top Button -->
    <button class="return-to-top" id="returnToTop" aria-label="Return to top">↑</button>

    <script src="/js/shared.js"></script>
    <script src="/js/characters.js"></script>
</body>
</html>
