<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading - D&D DM Toolkit</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 50%, #2d1b4e 100%);
            color: #e8e8e8;
            font-family: 'Cinzel', serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated background particles */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        .particle {
            position: absolute;
            background: rgba(167, 139, 250, 0.3);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }

        .particle:nth-child(1) {
            width: 4px;
            height: 4px;
            left: 10%;
            animation-delay: 0s;
            animation-duration: 8s;
        }

        .particle:nth-child(2) {
            width: 6px;
            height: 6px;
            left: 20%;
            animation-delay: 2s;
            animation-duration: 10s;
        }

        .particle:nth-child(3) {
            width: 3px;
            height: 3px;
            left: 30%;
            animation-delay: 4s;
            animation-duration: 7s;
        }

        .particle:nth-child(4) {
            width: 5px;
            height: 5px;
            left: 40%;
            animation-delay: 1s;
            animation-duration: 9s;
        }

        .particle:nth-child(5) {
            width: 4px;
            height: 4px;
            left: 50%;
            animation-delay: 3s;
            animation-duration: 6s;
        }

        .particle:nth-child(6) {
            width: 7px;
            height: 7px;
            left: 60%;
            animation-delay: 5s;
            animation-duration: 8s;
        }

        .particle:nth-child(7) {
            width: 3px;
            height: 3px;
            left: 70%;
            animation-delay: 2s;
            animation-duration: 7s;
        }

        .particle:nth-child(8) {
            width: 5px;
            height: 5px;
            left: 80%;
            animation-delay: 4s;
            animation-duration: 9s;
        }

        .particle:nth-child(9) {
            width: 4px;
            height: 4px;
            left: 90%;
            animation-delay: 1s;
            animation-duration: 6s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            50% {
                transform: translateY(-10vh) rotate(180deg);
            }
        }

        .loading-container {
            text-align: center;
            z-index: 2;
            position: relative;
        }

        .logo {
            font-size: 4rem;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, #a78bfa, #ec4899, #f59e0b);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 3s ease-in-out infinite;
        }

        @keyframes gradientShift {
            0%, 100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        .app-title {
            font-size: 2.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #e8e8e8;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .app-subtitle {
            font-size: 1.2rem;
            color: #a78bfa;
            margin-bottom: 3rem;
            opacity: 0.8;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(167, 139, 250, 0.2);
            border-top: 4px solid #a78bfa;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 2rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 1.1rem;
            color: #e8e8e8;
            margin-bottom: 1rem;
            opacity: 0.9;
        }

        .loading-dots {
            display: inline-block;
            animation: dots 1.5s infinite;
        }

        @keyframes dots {
            0%, 20% {
                content: '';
            }
            40% {
                content: '.';
            }
            60% {
                content: '..';
            }
            80%, 100% {
                content: '...';
            }
        }

        .loading-dots::after {
            content: '';
            animation: dots 1.5s infinite;
        }

        .progress-bar {
            width: 300px;
            height: 4px;
            background: rgba(167, 139, 250, 0.2);
            border-radius: 2px;
            margin: 2rem auto 0;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #a78bfa, #ec4899);
            border-radius: 2px;
            width: 0%;
            animation: progress 3s ease-in-out infinite;
        }

        @keyframes progress {
            0% {
                width: 0%;
            }
            50% {
                width: 70%;
            }
            100% {
                width: 100%;
            }
        }

        .version-info {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.9rem;
            color: rgba(232, 232, 232, 0.6);
            z-index: 2;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .logo {
                font-size: 3rem;
            }
            
            .app-title {
                font-size: 2rem;
            }
            
            .app-subtitle {
                font-size: 1rem;
            }
            
            .progress-bar {
                width: 250px;
            }
        }
    </style>
</head>
<body>
    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <div class="loading-container">
        <div class="logo">🎲</div>
        <h1 class="app-title">D&D DM Toolkit</h1>
        <p class="app-subtitle">Multi-Campaign Management System</p>
        
        <div class="loading-spinner"></div>
        
        <div class="loading-text">
            Initializing your campaign world<span class="loading-dots"></span>
        </div>
        
        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>
    </div>

    <div class="version-info">
        Version 2.0.0
    </div>

    <script>
        // Add some dynamic loading messages
        const messages = [
            "Initializing your campaign world",
            "Loading character sheets",
            "Preparing dice roller",
            "Setting up initiative tracker",
            "Loading spell database",
            "Preparing battle board",
            "Almost ready"
        ];

        let messageIndex = 0;
        const loadingText = document.querySelector('.loading-text');

        function updateLoadingMessage() {
            if (messageIndex < messages.length) {
                loadingText.innerHTML = messages[messageIndex] + '<span class="loading-dots"></span>';
                messageIndex++;
            } else {
                messageIndex = 0;
                loadingText.innerHTML = messages[messageIndex] + '<span class="loading-dots"></span>';
            }
        }

        // Update message every 800ms
        setInterval(updateLoadingMessage, 800);

        // Listen for the app ready event
        window.addEventListener('DOMContentLoaded', () => {
            console.log('Loading screen ready');
        });
    </script>
</body>
</html>
